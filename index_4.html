<!DOCTYPE html>
<html lang="en-CA" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#061305" id="metaTheme">
<script>/* set before first paint so the canvas never flashes */
document.documentElement.dataset.theme=matchMedia("(prefers-color-scheme: light)").matches?"light":"dark";</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Aurora V2 — money that moves with you</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   AURORA — DESIGN TOKENS
   Resolved at hue 142 — gamut mapped, contrast solved
   ============================================================ */
:root{
  --c-050:#eff8ed;
  --c-100:#d7ebd4;
  --c-200:#b0d7ac;
  --c-300:#84bc7d;
  --c-400:#589c51;
  --c-500:#3c7d36;
  --c-600:#2c6027;
  --c-700:#1f451c;
  --c-800:#132b10;
  --c-900:#061305;
  --s-400:#a890fd;
  --s-600:#6c58ad;
  /* Role bindings live in the theme blocks below. The ramp above never
     changes — only which rung each role points at. */

  /* Tailwind v4 bridge — same values, ready if this moves to a build step */
  --color-brand-050:#eff8ed; --color-brand-100:#d7ebd4; --color-brand-200:#b0d7ac;
  --color-brand-300:#84bc7d; --color-brand-400:#589c51; --color-brand-500:#3c7d36;
  --color-brand-600:#2c6027; --color-brand-700:#1f451c; --color-brand-800:#132b10;
  --color-brand-900:#061305;

  /* Type */
  --f-display:'Bricolage Grotesque','Archivo',ui-sans-serif,system-ui,sans-serif;
  --f-ui:'Instrument Sans',ui-sans-serif,system-ui,-apple-system,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace;

  --r-sm:14px; --r-md:20px; --r-lg:28px; --r-pill:999px;
  --ease:cubic-bezier(.22,.9,.24,1);
  --ease-spring:cubic-bezier(.16,1.02,.32,1);
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:var(--canvas);
  color:var(--text-primary);
  font-family:var(--f-ui);
  font-size:14px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  overscroll-behavior:none;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px;border-radius:6px}
::selection{background:var(--c-300);color:var(--text-on-action)}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ============================================================
   THEMES — every ratio below is measured, not estimated.
   c-900 on c-300 is 8.59:1, so the action binding is the same
   in both modes and needs no override.
   ============================================================ */
/*THEME_START*/
[data-theme="dark"]{
  --canvas:#061305; --canvas-2:#132b10;
  --text-primary:#ffffff;        /* 19.04:1 on canvas */
  --text-secondary:#b0d7ac;      /* 11.93:1 */
  --text-tertiary:#84bc7d;       /*  8.59:1 */
  --accent-text:#b0d7ac;         /* 11.93:1 */
  --icon:#b0d7ac;
  --text-on-action:#061305;      /*  8.59:1 on c-300 */
  --text-on-raised:#ffffff;      /* 10.90:1 on c-700 */
  --text-on-alert:#061305;       /*  7.32:1 on s-400 */
  --focus-ring:#b0d7ac;          /* 11.93:1 */
  --pos:#b0d7ac;                 /* 11.93:1 */
  --neg:#a890fd;                 /*  7.32:1 */
  --pos-text:#d7ebd4;
  --alert-surface:#a890fd; --alert-ink:#061305;
  --chart-line:#84bc7d;
  --gauge-1:#3c7d36; --gauge-2:#84bc7d; --gauge-3:#d7ebd4;
  --bar-grad:linear-gradient(90deg,#589c51,#b0d7ac);

  --fill-1:rgba(176,215,172,.07);
  --fill-2:rgba(176,215,172,.10);
  --fill-3:rgba(176,215,172,.15);
  --fill-4:rgba(176,215,172,.28);
  --hairline:rgba(176,215,172,.15);
  --hairline-strong:rgba(176,215,172,.26);
  --veil-1:rgba(6,19,5,.34);
  --veil-2:rgba(6,19,5,.66);
  --veil-3:rgba(6,19,5,.92);
  --sig-fill:rgba(168,144,253,.18);
  --sig-fill-2:rgba(168,144,253,.11);
  --sig-line:rgba(168,144,253,.34);
  --edge-hi:rgba(239,248,237,.10);

  --glass-fill:linear-gradient(157deg,rgba(176,215,172,.09) 0%,rgba(19,43,16,.50) 38%,rgba(6,19,5,.72) 100%);
  --panel-fill:linear-gradient(157deg,rgba(176,215,172,.05) 0%,rgba(19,43,16,.32) 42%,rgba(6,19,5,.40) 100%);
  --specular:inset 0 1px 0 rgba(239,248,237,.12), inset 0 -1px 0 rgba(0,0,0,.26);
  --lift:0 20px 44px -26px rgba(0,0,0,.92);
  --sheet-fill:linear-gradient(170deg,rgba(31,69,28,.94),rgba(6,19,5,.97));
  --alert-grad:linear-gradient(160deg,var(--s-400),var(--s-600));
  --pile-sh-a:.5;
  --sky-blend:screen; --sky-alpha:1; --star-alpha:.5;
}
[data-theme="light"]{
  --canvas:#eff8ed; --canvas-2:#d7ebd4;
  --text-primary:#061305;        /* 17.51:1 on canvas */
  --text-secondary:#1f451c;      /* 10.03:1 */
  --text-tertiary:#2c6027;       /*  6.88:1 */
  --accent-text:#2c6027;         /*  6.88:1 */
  --icon:#2c6027;
  --text-on-action:#061305;      /*  8.59:1 on c-300 — unchanged */
  --text-on-raised:#ffffff;      /* 10.90:1 on c-700 */
  --text-on-alert:#ffffff;       /*  5.77:1 on s-600 */
  --focus-ring:#2c6027;          /*  6.88:1 */
  --pos:#2c6027;                 /*  6.88:1 */
  --neg:#6c58ad;                 /*  5.31:1 — s-400 is only 2.39:1 here */
  --pos-text:#1f451c;
  --alert-surface:#6c58ad; --alert-ink:#ffffff;
  --chart-line:#3c7d36;          /*  4.62:1 */
  --gauge-1:#2c6027; --gauge-2:#589c51; --gauge-3:#84bc7d;
  --bar-grad:linear-gradient(90deg,#2c6027,#589c51);

  --fill-1:rgba(31,69,28,.045);
  --fill-2:rgba(31,69,28,.075);
  --fill-3:rgba(31,69,28,.11);
  --fill-4:rgba(31,69,28,.22);
  --hairline:rgba(31,69,28,.14);
  --hairline-strong:rgba(31,69,28,.24);
  --veil-1:rgba(239,248,237,.40);
  --veil-2:rgba(239,248,237,.74);
  --veil-3:rgba(239,248,237,.94);
  --sig-fill:rgba(108,88,173,.13);
  --sig-fill-2:rgba(108,88,173,.07);
  --sig-line:rgba(108,88,173,.30);
  --edge-hi:rgba(255,255,255,.9);

  --glass-fill:linear-gradient(157deg,rgba(255,255,255,.86) 0%,rgba(255,255,255,.62) 46%,rgba(215,235,212,.52) 100%);
  --panel-fill:linear-gradient(157deg,rgba(255,255,255,.72) 0%,rgba(255,255,255,.46) 50%,rgba(215,235,212,.34) 100%);
  --specular:inset 0 1px 0 rgba(255,255,255,.9), inset 0 -1px 0 rgba(31,69,28,.05);
  --lift:0 18px 38px -26px rgba(6,19,5,.28);
  --sheet-fill:linear-gradient(170deg,rgba(255,255,255,.97),rgba(239,248,237,.98));
  --alert-grad:linear-gradient(160deg,var(--s-600),var(--s-600));  /* white on s-600 = 5.77:1; s-400 would be 2.39:1 */
  --pile-sh-a:.16;
  --sky-blend:multiply; --sky-alpha:.34; --star-alpha:0;
}
/*THEME_END*/

/* ============================================================
   DEVICE SHELL — full bleed on a phone, framed on a desktop
   ============================================================ */
.stage{min-height:100dvh;display:grid;place-items:center;background:
  radial-gradient(120% 90% at 50% -10%,var(--canvas-2) 0%,var(--canvas) 62%)}
.phone{
  position:relative;width:100%;max-width:430px;height:100dvh;
  background:var(--canvas);overflow:hidden;isolation:isolate;
}
@media (min-width:900px){
  .stage{padding:28px}
  .phone{height:min(920px,calc(100dvh - 56px));border-radius:46px;
    border:1px solid var(--fill-3);
    box-shadow:0 60px 120px -50px rgba(0,0,0,.9), 0 0 0 10px var(--veil-2), inset 0 1px 0 var(--edge-hi)}
}

/* ---- THE SIGNATURE: a live aurora behind the glass -------- */
.sky{position:absolute;inset:0 0 auto;height:58%;z-index:0;pointer-events:none;
  -webkit-mask-image:linear-gradient(to bottom,#000 0%,#000 52%,transparent 96%);
  mask-image:linear-gradient(to bottom,#000 0%,#000 52%,transparent 96%);
  transform:translate3d(0,var(--sky-y,0px),0);opacity:calc(var(--sky-o,1) * var(--sky-alpha));
  transition:opacity .3s linear}
.stars{position:absolute;inset:0;opacity:var(--star-alpha);
  background-image:
    radial-gradient(1px 1px at 12% 18%,#eff8ed99,transparent),
    radial-gradient(1px 1px at 74% 12%,#d7ebd4aa,transparent),
    radial-gradient(1px 1px at 42% 30%,#b0d7ac88,transparent),
    radial-gradient(1.4px 1.4px at 88% 34%,#eff8ed77,transparent),
    radial-gradient(1px 1px at 25% 46%,#a890fd88,transparent),
    radial-gradient(1px 1px at 60% 40%,#d7ebd466,transparent),
    radial-gradient(1px 1px at 92% 8%,#eff8ed66,transparent)}
.band{position:absolute;left:-40%;width:180%;filter:blur(52px);mix-blend-mode:var(--sky-blend);will-change:transform}
.band-1{top:-24%;height:74%;
  background:conic-gradient(from 190deg at 42% 60%,transparent 0deg,var(--c-500) 42deg,var(--c-300) 74deg,var(--c-400) 106deg,transparent 152deg);
  opacity:.62;animation:drift1 56s var(--ease) infinite alternate}
.band-2{top:-6%;height:60%;
  background:conic-gradient(from 340deg at 62% 44%,transparent 0deg,var(--c-600) 34deg,var(--c-400) 68deg,transparent 120deg);
  opacity:.5;animation:drift2 72s var(--ease) infinite alternate}
.band-3{top:-30%;height:46%;
  background:linear-gradient(96deg,transparent 8%,var(--s-600) 34%,var(--s-400) 52%,transparent 78%);
  opacity:.30;animation:drift3 50s var(--ease) infinite alternate}
@keyframes drift1{0%{transform:translate3d(-4%,0,0) skewX(-5deg) scaleY(1)}100%{transform:translate3d(5%,2%,0) skewX(4deg) scaleY(1.06)}}
@keyframes drift2{0%{transform:translate3d(4%,1%,0) skewX(6deg)}100%{transform:translate3d(-5%,-2%,0) skewX(-3deg)}}
@keyframes drift3{0%{transform:translate3d(-6%,0,0) skewX(-7deg)}100%{transform:translate3d(5%,2%,0) skewX(5deg)}}
@media (prefers-reduced-motion:reduce){
  .band{animation:none!important}
  *{animation-duration:.001ms!important;transition-duration:.001ms!important}
}

/* ============================================================
   HEADER
   ============================================================ */
.head{position:absolute;top:0;left:0;right:0;z-index:40;
  padding:calc(env(safe-area-inset-top,0px) + 12px) 18px 12px;
  display:flex;align-items:center;gap:12px;
  background:linear-gradient(to bottom,var(--veil-2),rgba(6,19,5,0));
  transition:background .28s var(--ease),box-shadow .28s var(--ease)}
.head.is-stuck{background:var(--veil-2);backdrop-filter:blur(20px) saturate(115%);
  -webkit-backdrop-filter:blur(20px) saturate(115%);box-shadow:0 1px 0 var(--hairline)}
.avatar{width:38px;height:38px;border-radius:var(--r-pill);flex:none;
  background:linear-gradient(150deg,var(--c-300),var(--c-600));color:var(--text-on-action);
  display:grid;place-items:center;font-weight:700;font-size:13px;letter-spacing:.02em;
  box-shadow:var(--specular)}
.greet{flex:1;min-width:0}
.greet b{display:block;font-size:14px;font-weight:600;letter-spacing:-.01em}
.greet span{display:block;font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--text-tertiary)}
.icon-btn{width:38px;height:38px;border-radius:var(--r-pill);flex:none;display:grid;place-items:center;
  background:var(--fill-2);border:1px solid var(--hairline);position:relative;
  transition:background .2s var(--ease),transform .2s var(--ease)}
.icon-btn:active{transform:scale(.93);background:var(--fill-3)}
.icon-btn .dot{position:absolute;top:8px;right:9px;width:7px;height:7px;border-radius:50%;
  background:var(--s-400);box-shadow:0 0 0 2px var(--c-900)}

/* ============================================================
   SCROLL AREA + SCREENS
   ============================================================ */
.scroll{position:absolute;inset:0;z-index:10;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;
  padding:calc(env(safe-area-inset-top,0px) + 74px) 0 132px}
.scroll::-webkit-scrollbar{display:none}
.screen{display:none;padding:0 18px}
.screen.is-on{display:block;animation:enter .34s var(--ease) both}
@keyframes enter{from{opacity:0;transform:translate3d(0,10px,0)}to{opacity:1;transform:none}}
.title{font-family:var(--f-display);font-size:26px;font-weight:700;letter-spacing:-.025em;margin:2px 0 2px}
.sub{color:var(--text-secondary);font-size:13px;margin:0 0 18px}

/* reveal on scroll */
.rv{opacity:0;transform:translate3d(0,14px,0);transition:opacity .5s var(--ease),transform .55s var(--ease)}
.rv.seen{opacity:1;transform:none}

/* ============================================================
   TAB BAR
   ============================================================ */
.tabbar{position:absolute;left:12px;right:12px;z-index:50;
  bottom:calc(env(safe-area-inset-bottom,0px) + 12px);
  display:grid;grid-template-columns:repeat(5,1fr);padding:7px;gap:2px;
  border-radius:26px;border:1px solid var(--hairline);
  background:linear-gradient(160deg,var(--fill-3),var(--veil-3));
  backdrop-filter:blur(22px) saturate(118%);-webkit-backdrop-filter:blur(22px) saturate(118%);
  box-shadow:var(--specular),0 22px 46px -22px #000}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:8px 2px 6px;border-radius:19px;color:var(--text-tertiary);
  font-size:10px;font-weight:600;letter-spacing:.01em;
  transition:color .22s var(--ease),transform .22s var(--ease)}
.tab svg{width:21px;height:21px;stroke-width:1.7}
.tab:active{transform:scale(.9)}
.tab[aria-selected="true"]{color:var(--text-on-action)}
.tab[aria-selected="true"]::before{content:"";position:absolute;inset:0;border-radius:19px;z-index:-1;
  background:linear-gradient(160deg,var(--c-200),var(--c-300) 62%,var(--c-400));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 6px 18px -8px var(--c-400);
  animation:pop .3s var(--ease-spring) both}
@keyframes pop{from{transform:scale(.82);opacity:0}to{transform:scale(1);opacity:1}}

/* ============================================================
   SURFACES
   .glass = real backdrop-filter (used sparingly, phone GPU cost)
   .panel = matched translucent fill, no filter
   ============================================================ */
.glass{background:var(--glass-fill);border:1px solid var(--hairline);border-radius:var(--r-md);
  backdrop-filter:blur(20px) saturate(115%);-webkit-backdrop-filter:blur(20px) saturate(115%);
  box-shadow:var(--specular),var(--lift)}
.panel{background:var(--panel-fill);border:1px solid var(--hairline);border-radius:var(--r-md);
  box-shadow:var(--specular)}
.card{padding:16px;margin-bottom:14px;position:relative;overflow:hidden}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.card-h h3{margin:0;font-size:14px;font-weight:600;letter-spacing:-.005em;flex:1}
.eyebrow{font-family:var(--f-mono);font-size:10px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--text-tertiary)}
.link{font-size:12px;font-weight:600;color:var(--accent-text)}
.hr{height:1px;background:var(--hairline);margin:12px -16px;border:0}

/* ---- Hero balance ---------------------------------------- */
.hero{padding:22px 20px 18px;border-radius:var(--r-lg);margin-bottom:14px}
.hero .amt{font-family:var(--f-display);font-weight:700;letter-spacing:-.045em;line-height:1;
  font-size:clamp(40px,12.5vw,54px);font-variant-numeric:tabular-nums;
  display:flex;align-items:baseline;gap:2px}
.hero .cents{font-size:.52em;letter-spacing:-.02em;color:var(--text-secondary)}
.hero .delta{display:inline-flex;align-items:center;gap:6px;margin-top:10px;
  font-family:var(--f-mono);font-size:11.5px;padding:5px 10px;border-radius:var(--r-pill);
  background:rgba(132,188,125,.16);border:1px solid rgba(132,188,125,.3);color:var(--pos-text)}
.hero .delta.neg{background:var(--sig-fill);border-color:var(--sig-line);color:var(--text-primary)}

/* ---- Quick actions --------------------------------------- */
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.qa button{display:flex;flex-direction:column;align-items:center;gap:7px;padding:13px 4px 11px;
  border-radius:var(--r-sm);background:var(--panel-fill);border:1px solid var(--hairline);
  font-size:10.5px;font-weight:600;color:var(--text-secondary);
  transition:transform .2s var(--ease),border-color .2s var(--ease)}
.qa button:active{transform:scale(.94);border-color:var(--hairline-strong)}
.qa svg{width:19px;height:19px;stroke:var(--icon);stroke-width:1.8}

/* ---- Signal note (s-400) --------------------------------- */
.note{display:flex;gap:11px;align-items:flex-start;padding:13px 14px;border-radius:var(--r-sm);
  background:linear-gradient(150deg,var(--sig-fill),var(--sig-fill-2));
  border:1px solid var(--sig-line);margin-bottom:14px}
.note .spark-i{width:26px;height:26px;border-radius:9px;flex:none;display:grid;place-items:center;
  background:var(--alert-surface);color:var(--alert-ink)}
.note p{margin:0;font-size:12.5px;line-height:1.5;color:var(--text-primary);opacity:.9}
.note b{font-weight:700;opacity:1}

/* ---- Segmented control ----------------------------------- */
.segwrap{position:sticky;top:calc(env(safe-area-inset-top,0px) + 62px);z-index:30;
  margin:0 -18px 14px;padding:8px 18px 10px;
  background:linear-gradient(to bottom,var(--veil-3) 62%,rgba(6,19,5,0))}
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;padding:8px 14px;border-radius:var(--r-pill);font-size:12.5px;font-weight:600;
  color:var(--text-tertiary);background:var(--fill-1);border:1px solid transparent;
  transition:all .22s var(--ease)}
.seg button[aria-selected="true"]{background:var(--c-700);border-color:var(--hairline-strong);
  color:var(--text-on-raised)}

/* ---- Chips ----------------------------------------------- */
.chips{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;margin-bottom:14px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 13px;border-radius:var(--r-pill);font-size:12px;font-weight:600;
  background:var(--fill-1);border:1px solid var(--hairline);color:var(--text-secondary);
  transition:all .2s var(--ease)}
.chip[aria-pressed="true"]{background:var(--c-300);border-color:var(--c-200);color:var(--text-on-action)}

/* ---- List rows ------------------------------------------- */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;text-align:left;width:100%;
  border-bottom:1px solid var(--fill-2);transition:opacity .18s var(--ease)}
.row:last-child{border-bottom:0}
.row:active{opacity:.6}
.ricon{width:38px;height:38px;border-radius:12px;flex:none;display:grid;place-items:center;
  background:var(--fill-2);border:1px solid var(--hairline);
  font-family:var(--f-display);font-weight:600;font-size:14px;color:var(--text-secondary)}
.ricon svg{width:18px;height:18px;stroke:var(--icon);stroke-width:1.8}
.rmain{flex:1;min-width:0}
.rmain b{display:block;font-size:13.5px;font-weight:600;letter-spacing:-.005em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rmain span{display:block;font-size:11.5px;color:var(--text-tertiary);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ramt{text-align:right;flex:none}
.ramt b{display:block;font-family:var(--f-mono);font-size:13px;font-weight:500;
  font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.ramt span{display:block;font-family:var(--f-mono);font-size:11px;color:var(--text-tertiary)}
.up{color:var(--pos)!important}
.down{color:var(--neg)!important}  /* 7.30:1 on c-900 */
.day{font-family:var(--f-mono);font-size:10px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--text-tertiary);padding:16px 0 4px}

/* ---- Bars, rings, gauge ---------------------------------- */
.bar{height:7px;border-radius:var(--r-pill);background:var(--fill-3);overflow:hidden}
.bar i{display:block;height:100%;border-radius:var(--r-pill);
  background:var(--bar-grad);width:0;
  transition:width 1s var(--ease)}
.bar.alt i{background:linear-gradient(90deg,var(--s-600),var(--s-400))}
.catrow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;margin-bottom:13px}
.catrow .n{font-size:12.5px;font-weight:600}
.catrow .v{font-family:var(--f-mono);font-size:12px;color:var(--text-secondary);
  font-variant-numeric:tabular-nums}
.catrow .bar{grid-column:1/-1}
.gauge{display:block;margin:0 auto}
.gauge .track{stroke:var(--fill-3)}
.gauge .fill{stroke:url(#gg);stroke-linecap:round;transition:stroke-dashoffset 1.3s var(--ease)}
.gnum{font-family:var(--f-display);font-size:44px;font-weight:700;letter-spacing:-.04em;
  text-align:center;line-height:1;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{padding:12px;border-radius:var(--r-sm);background:var(--fill-1);
  border:1px solid var(--hairline)}
.stat .k{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--text-tertiary);display:block;margin-bottom:5px}
.stat .v{font-family:var(--f-display);font-size:17px;font-weight:600;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums}

/* ---- Virtual card art ------------------------------------ */
.cardart{position:relative;aspect-ratio:1.586;border-radius:22px;padding:18px;overflow:hidden;
  background:linear-gradient(146deg,var(--c-500) 0%,var(--c-700) 46%,var(--c-900) 100%);
  border:1px solid rgba(176,215,172,.28);
  box-shadow:inset 0 1px 0 rgba(239,248,237,.28),0 26px 50px -28px #000;
  display:flex;flex-direction:column;justify-content:space-between;
  transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transform-style:preserve-3d;
  transition:transform .75s var(--ease)}
.cardart::after{content:"";position:absolute;inset:-40%;pointer-events:none;
  background:linear-gradient(104deg,transparent 38%,rgba(239,248,237,.16) 47%,rgba(168,144,253,.10) 52%,transparent 61%);
  transform:translateX(var(--sheen,-30%));transition:transform .75s var(--ease)}
.cardart.tone-spend{background:linear-gradient(146deg,#3c7d36 0%,#1f451c 46%,#061305 100%)}
.cardart.tone-build{background:linear-gradient(146deg,#6c58ad 0%,#1f451c 52%,#061305 100%)}
.cardart.tone-grow{background:linear-gradient(146deg,#589c51 0%,#2c6027 48%,#132b10 100%)}
.cardart.frozen{filter:saturate(.35) brightness(.8)}
.cardart .brand{font-family:var(--f-display);font-size:16px;font-weight:700;letter-spacing:-.02em}
.cardart .pan{font-family:var(--f-mono);font-size:16px;letter-spacing:.14em;
  display:flex;gap:10px;flex-wrap:wrap}
.cardart .meta{display:flex;gap:20px;align-items:flex-end}
.cardart .meta span{font-family:var(--f-mono);font-size:9px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--c-200);display:block}
.cardart .meta b{font-family:var(--f-mono);font-size:12.5px;font-weight:500}
.chipart{width:34px;height:25px;border-radius:6px;
  background:linear-gradient(135deg,#d7ebd4,#84bc7d 52%,#3c7d36);
  box-shadow:inset 0 0 0 1px rgba(6,19,5,.3)}
.frozen-tag{position:absolute;inset:0;display:grid;place-items:center;
  font-family:var(--f-mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;
  background:rgba(6,19,5,.55);color:var(--c-100)}

/* ---- Toggle ---------------------------------------------- */
.tog{display:flex;align-items:center;gap:12px;padding:12px 0;width:100%;text-align:left;
  border-bottom:1px solid var(--fill-2)}
.tog:last-child{border-bottom:0}
.tog .tmain{flex:1}
.tog .tmain b{display:block;font-size:13.5px;font-weight:600}
.tog .tmain span{display:block;font-size:11.5px;color:var(--text-tertiary);line-height:1.4}
.sw{width:46px;height:27px;border-radius:var(--r-pill);flex:none;position:relative;
  background:var(--fill-3);border:1px solid var(--hairline);transition:background .26s var(--ease)}
.sw i{position:absolute;top:2px;left:2px;width:21px;height:21px;border-radius:50%;
  background:var(--text-on-raised);transition:transform .3s var(--ease-spring),background .26s var(--ease)}
.tog[aria-pressed="true"] .sw{background:var(--c-300);border-color:var(--accent-text)}
.tog[aria-pressed="true"] .sw i{transform:translateX(19px);background:var(--c-900)}

/* ---- Buttons --------------------------------------------- */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  padding:14px;border-radius:var(--r-sm);font-size:14px;font-weight:700;letter-spacing:-.01em;
  background:linear-gradient(160deg,var(--c-200),var(--c-300) 60%,var(--c-400));
  color:var(--text-on-action);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 12px 26px -14px var(--c-400);
  transition:transform .2s var(--ease)}
.btn:active{transform:scale(.975)}
.btn.ghost{background:var(--fill-2);border:1px solid var(--hairline);
  color:var(--text-primary);box-shadow:none}
.btn.alert{background:var(--alert-grad);
  color:var(--text-on-alert);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 12px 26px -14px var(--s-600)}
.btn2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ---- Sparkline ------------------------------------------- */
.spark{width:100%;height:120px;display:block;overflow:visible}
.spark path.ln{fill:none;stroke:var(--chart-line);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 1.1s var(--ease) forwards}
.spark path.ln.neg{stroke:var(--neg)}
.spark path.ar{fill:url(#ag);opacity:0;animation:fade .8s .35s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{to{opacity:1}}
.ranges{display:flex;gap:6px;justify-content:space-between;margin-top:12px}
.ranges button{flex:1;padding:7px 0;border-radius:10px;font-family:var(--f-mono);font-size:11px;
  color:var(--text-tertiary);transition:all .2s var(--ease)}
.ranges button[aria-selected="true"]{background:var(--fill-3);color:var(--c-100)}

/* ---- Grid tiles ------------------------------------------ */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{padding:14px;border-radius:var(--r-sm);text-align:left;
  background:var(--panel-fill);border:1px solid var(--hairline);
  transition:transform .2s var(--ease),border-color .2s var(--ease)}
.tile:active{transform:scale(.97);border-color:var(--hairline-strong)}
.tile svg{width:20px;height:20px;stroke:var(--icon);stroke-width:1.8;margin-bottom:9px}
.tile b{display:block;font-size:13px;font-weight:600;margin-bottom:3px}
.tile span{display:block;font-size:11px;color:var(--text-tertiary);line-height:1.4}

/* ---- Goals ----------------------------------------------- */
.goal{padding:15px;border-radius:var(--r-sm);background:var(--panel-fill);
  border:1px solid var(--hairline);margin-bottom:10px}
.goal .top{display:flex;align-items:center;gap:11px;margin-bottom:11px}
.goal .emo{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:17px;
  background:var(--fill-2);border:1px solid var(--hairline)}
.goal .top b{flex:1;font-size:13.5px;font-weight:600}
.goal .top .pc{font-family:var(--f-mono);font-size:12px;color:var(--accent-text)}
.goal .fig{display:flex;justify-content:space-between;margin-top:8px;
  font-family:var(--f-mono);font-size:11px;color:var(--text-tertiary)}

/* ---- Bottom sheet ---------------------------------------- */
.scrim{position:absolute;inset:0;z-index:60;background:rgba(6,19,5,.58);  /* scrim stays dark in both modes */
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  opacity:0;pointer-events:none;transition:opacity .3s var(--ease)}
.scrim.is-on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:70;max-height:86%;overflow-y:auto;
  scrollbar-width:none;padding:10px 18px calc(env(safe-area-inset-bottom,0px) + 24px);
  border-radius:var(--r-lg) var(--r-lg) 0 0;border:1px solid var(--hairline);border-bottom:0;
  background:var(--sheet-fill);
  backdrop-filter:blur(24px) saturate(118%);-webkit-backdrop-filter:blur(24px) saturate(118%);
  box-shadow:var(--specular),0 -24px 60px -20px #000;
  transform:translate3d(0,102%,0);transition:transform .4s var(--ease-spring)}
.sheet::-webkit-scrollbar{display:none}
.sheet.is-on{transform:none}
.grab{width:38px;height:4px;border-radius:var(--r-pill);background:var(--fill-4);
  margin:0 auto 14px}

/* ---- Ask Aurora ------------------------------------------ */
.chat{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.msg{max-width:86%;padding:11px 14px;border-radius:18px;font-size:13px;line-height:1.5}
.msg.me{align-self:flex-end;background:linear-gradient(160deg,var(--c-200),var(--c-300));
  color:var(--text-on-action);border-bottom-right-radius:6px;font-weight:500}
.msg.ai{align-self:flex-start;background:var(--fill-2);border:1px solid var(--hairline);
  color:var(--text-primary);border-bottom-left-radius:6px}
.msg.ai b{color:var(--accent-text)}
.msg.ai .kv{font-family:var(--f-mono);font-size:12px;color:var(--text-primary)}
.ask{display:flex;gap:9px;align-items:center;padding:7px 7px 7px 15px;border-radius:var(--r-pill);
  background:var(--fill-1);border:1px solid var(--hairline)}
.ask input{flex:1;min-width:0;background:none;border:0;outline:none;font-size:13.5px}
.ask input::placeholder{color:var(--text-tertiary)}
.ask .go{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:var(--c-300);color:var(--text-on-action)}
.typing span{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--accent-text);
  margin-right:3px;animation:blink 1.1s infinite}
.typing span:nth-child(2){animation-delay:.16s}
.typing span:nth-child(3){animation-delay:.32s}
@keyframes blink{0%,60%,100%{opacity:.28;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}

/* ---- Toast ----------------------------------------------- */
.toast{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 96px);z-index:90;
  transform:translate(-50%,16px);opacity:0;pointer-events:none;
  padding:11px 17px;border-radius:var(--r-pill);font-size:12.5px;font-weight:600;
  background:var(--veil-3);border:1px solid var(--hairline-strong);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);white-space:nowrap;
  transition:opacity .28s var(--ease),transform .28s var(--ease-spring)}
.toast.is-on{opacity:1;transform:translate(-50%,0)}


/* ============================================================
   CASCADING CARD STACK — wallet-style, tap a back card to pull
   it forward. Transforms are driven by --i so the reorder
   animates in place instead of re-rendering.
   ============================================================ */
.stack{position:relative;height:0;padding-bottom:calc(63.05% + 92px);margin-bottom:16px}
.slot{position:absolute;left:0;right:0;top:0;aspect-ratio:1.586;
  transform-origin:50% 0;
  transform:translate3d(0,calc(var(--i,0) * 46px),0) scale(calc(1 - var(--i,0) * .05));
  filter:brightness(calc(1 - var(--i,0) * .14));
  transition:transform .58s var(--ease-spring),filter .45s var(--ease);
  cursor:pointer}
.slot.is-front{cursor:default}
.slot .cardart{width:100%;height:100%;position:absolute;inset:0}
.stack-legend{display:flex;gap:6px;justify-content:center;margin:-4px 0 16px}
.stack-legend button{width:7px;height:7px;border-radius:50%;background:var(--fill-4);
  transition:background .3s var(--ease),transform .3s var(--ease)}
.stack-legend button[aria-current="true"]{background:var(--accent-text);transform:scale(1.3)}

/* ============================================================
   TICKER TAPE — ported from the earlier Aurora build.
   The run holds the feed twice and travels -50%, so the loop
   is seamless. .slow is his second speed (52s vs 34s).
   ============================================================ */
.tape{position:relative;overflow:hidden;border-radius:16px;padding:9px 0;margin:2px 0 14px;
  background:var(--fill-1);border:1px solid var(--hairline);
  backdrop-filter:blur(20px) saturate(115%);-webkit-backdrop-filter:blur(20px) saturate(115%);
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 9%,#000 91%,transparent);
  mask-image:linear-gradient(90deg,transparent,#000 9%,#000 91%,transparent)}
.tape-run{display:flex;width:max-content;animation:tape 34s linear infinite}
.tape:hover .tape-run,.tape:active .tape-run{animation-play-state:paused}
.tape.slow .tape-run{animation-duration:52s}
@keyframes tape{to{transform:translate3d(-50%,0,0)}}
.tick{display:flex;align-items:baseline;gap:7px;padding:0 15px;white-space:nowrap;
  border-right:1px solid var(--hairline)}
.tick b{font-family:var(--f-mono);font-size:12px;font-weight:500;letter-spacing:.04em;
  color:var(--text-primary)}
.tick i{font-style:normal;font-family:var(--f-mono);font-size:11.5px;color:var(--text-secondary);
  font-variant-numeric:tabular-nums}
.tick em{font-style:normal;font-family:var(--f-mono);font-size:11px;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){
  .tape{overflow-x:auto;scrollbar-width:none}
  .tape::-webkit-scrollbar{display:none}
  .tape-run{animation:none!important;transform:none!important}
}

/* ============================================================
   HORIZONTAL SNAP RAIL — "Your accounts", ported
   ============================================================ */
.rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;
  padding:2px 18px 8px;margin:0 -18px 6px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail-card{scroll-snap-align:start;flex:0 0 172px;padding:16px;border-radius:20px;text-align:left;
  background:var(--panel-fill);border:1px solid var(--hairline);box-shadow:var(--specular);
  transition:transform .2s var(--ease),border-color .2s var(--ease)}
.rail-card:active{transform:scale(.97);border-color:var(--hairline-strong)}
.rail-card .ic{display:block;margin-bottom:10px}
.rail-card .ic svg{width:18px;height:18px;stroke:var(--icon);stroke-width:1.8}
.rail-card b{display:block;font-size:13px;font-weight:600}
.rail-card .amt{font-family:var(--f-mono);font-size:16px;margin-top:5px;
  font-variant-numeric:tabular-nums;display:block}
.rail-card .sub{font-size:11px;color:var(--text-tertiary);display:block;margin-top:3px}

/* ============================================================
   CASCADING CARDS — the pile. Each card sticks, then scales,
   lifts, rounds and shades as the next settles onto it.
   His geometry: PILE_TOP + i*PEEK, smoothstep, scale 1-.085e.
   ============================================================ */
.pile{position:relative;margin-top:4px}
.pile-item{position:sticky;will-change:transform;margin-bottom:18px}
.pile-item:last-child{margin-bottom:0}
.pile-card{position:relative;overflow:hidden;border-radius:26px;padding:18px;
  background:var(--glass-fill);border:1px solid var(--hairline);
  backdrop-filter:blur(20px) saturate(115%);-webkit-backdrop-filter:blur(20px) saturate(115%);
  transform-origin:50% 0}
.pile-card::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(150deg,var(--fill-2),transparent 46%)}
.pile-card::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:var(--shade,0);
  background:linear-gradient(180deg,var(--veil-2),var(--veil-1));transition:opacity .1s linear}
.pile-hd{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:13px}
.pile-hd h3{font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:-.025em;margin:0}
.pile-hd .go{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--accent-text);padding:4px}
.pile-figure{font-family:var(--f-display);font-weight:700;font-size:30px;letter-spacing:-.03em;
  font-variant-numeric:tabular-nums;line-height:1;margin:0 0 6px}
.pile-note{margin:0;font-size:12px;color:var(--text-secondary)}

/* ============================================================
   LONG SCROLL — sectioned market page with sticky sub-heads
   and a depth rail under the app header
   ============================================================ */
.progress{position:absolute;left:0;right:0;z-index:39;height:2px;background:transparent;
  top:calc(env(safe-area-inset-top,0px) + 62px);opacity:0;transition:opacity .3s var(--ease)}
.progress.is-on{opacity:1}
.progress i{display:block;height:100%;width:0;background:var(--bar-grad);
  box-shadow:0 0 10px var(--chart-line);
  border-radius:0 var(--r-pill) var(--r-pill) 0}
.sect{margin-bottom:26px}
.sect-h{position:sticky;z-index:25;margin:0 -18px 12px;padding:9px 18px 9px;
  top:calc(env(safe-area-inset-top,0px) + 62px);
  background:var(--veil-3);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  display:flex;align-items:baseline;gap:9px;border-bottom:1px solid var(--hairline)}
.sect-h h3{margin:0;font-family:var(--f-display);font-size:17px;font-weight:700;
  letter-spacing:-.025em;flex:1}
.sect-h .n{font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--text-tertiary)}
.sect > p.lede{margin:0 0 12px;font-size:12.5px;color:var(--text-secondary);line-height:1.5}
.mover{display:grid;grid-template-columns:1fr auto;gap:3px 10px;padding:11px 0;
  border-bottom:1px solid var(--fill-2);text-align:left;width:100%}
.mover:last-child{border-bottom:0}
.mover b{font-size:13.5px;font-weight:600}
.mover .t{font-family:var(--f-mono);font-size:11px;color:var(--text-tertiary)}
.mover .d{font-family:var(--f-mono);font-size:14px;font-variant-numeric:tabular-nums;
  align-self:center;grid-row:1/3}
.sectorbar{display:grid;grid-template-columns:76px 1fr 52px;align-items:center;gap:10px;
  margin-bottom:11px}
.sectorbar .n{font-size:12.5px;font-weight:600}
.sectorbar .v{font-family:var(--f-mono);font-size:11.5px;text-align:right;
  font-variant-numeric:tabular-nums}
.sectorbar .rail{height:6px;border-radius:var(--r-pill);background:var(--fill-2);
  position:relative;overflow:hidden}
.sectorbar .rail i{position:absolute;top:0;bottom:0;left:50%;width:0;
  transition:width .9s var(--ease),left .9s var(--ease)}
.sectorbar .rail i.pos{background:var(--bar-grad)}
.sectorbar .rail i.neg{background:linear-gradient(90deg,var(--s-600),var(--s-400))}
.endcap{text-align:center;padding:8px 0 4px;font-family:var(--f-mono);font-size:10px;
  letter-spacing:.16em;text-transform:uppercase;color:var(--text-tertiary)}

/* ---- Keypad ---------------------------------------------- */
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.pad button{padding:15px 0;border-radius:var(--r-sm);font-family:var(--f-display);font-size:21px;
  font-weight:600;background:var(--fill-1);border:1px solid var(--hairline);
  transition:transform .15s var(--ease),background .15s var(--ease)}
.pad button:active{transform:scale(.93);background:var(--fill-3)}
.padamt{font-family:var(--f-display);font-size:clamp(38px,11vw,48px);font-weight:700;
  letter-spacing:-.04em;text-align:center;font-variant-numeric:tabular-nums;padding:10px 0 4px}
.people{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.people::-webkit-scrollbar{display:none}
.person{flex:none;width:60px;text-align:center}
.person .av{width:52px;height:52px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;
  font-family:var(--f-display);font-weight:600;font-size:16px;color:var(--text-on-raised);
  background:linear-gradient(150deg,var(--c-600),var(--c-800));border:1px solid var(--hairline);
  transition:transform .2s var(--ease),border-color .2s var(--ease)}
.person[aria-pressed="true"] .av{border-color:var(--c-300);transform:scale(1.06);
  box-shadow:0 0 0 2px rgba(132,188,125,.35)}
.person span{font-size:10.5px;color:var(--text-tertiary);display:block;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{text-align:center;padding:34px 20px;color:var(--text-tertiary);font-size:13px}
.empty b{display:block;color:var(--text-primary);font-size:14px;margin-bottom:5px}

/* ---- icon sizing per context (a <use> has no intrinsic size) ---- */
.phone svg{fill:none}
.btn svg{width:17px;height:17px;stroke:currentColor;stroke-width:1.9;flex:none}
.icon-btn svg{width:18px;height:18px;stroke:currentColor;stroke-width:1.8}
.ask > svg{width:17px;height:17px;stroke:var(--icon);stroke-width:1.9;flex:none}
.go svg{width:16px;height:16px;stroke:currentColor;stroke-width:2}
.spark-i svg{width:15px;height:15px;stroke:currentColor;stroke-width:2}
.gauge path{fill:none}

/* ---- balance figures settle in on render ---- */
@keyframes amtIn{from{opacity:0;transform:translate3d(0,8px,0);filter:blur(5px)}
  to{opacity:1;transform:none;filter:none}}
</style>

</linearGradient>

  const s = money(n).split('.');

}
function walk(seed,n,drift){
  let x=seed, v=100, out=[];
  for(let i=0;i<n;i++){ x=(x*9301+49297)%233280; out.push(v += (x/233280-.5)*3.4 + drift); }
  return out;
}
function sparkSVG(series,neg){
  const w=320,h=110,p=8;
  const mn=Math.min(...series), mx=Math.max(...series), rg=(mx-mn)||1;
  const pts=series.map((v,i)=>[p+i*(w-p*2)/(series.length-1), h-p-((v-mn)/rg)*(h-p*2)]);
  const d=pts.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' ');
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">
    <path class="ar" d="${d} L${w-p} ${h} L${p} ${h} Z"/>
    <path class="ln ${neg?'neg':''}" d="${d}" vector-effect="non-scaling-stroke"/></svg>`;
}
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* number roll-up — 900ms cubic ease-out */
function countUp(el,target){
  if(REDUCED){ el.innerHTML=splitMoney(target); return; }
  const t0=performance.now(), dur=900;
  (function step(t){
    const p=Math.min((t-t0)/dur,1), e=1-Math.pow(1-p,3);
    el.innerHTML=splitMoney(target*e);
    if(p<1) requestAnimationFrame(step);
  })(t0);
}
function splitMoney(n){
  const q=money(n).split('.');
  return q[0]+'<span class="cents">.'+q[1]+'</span>';
}

  $$('.amt[data-count]').forEach(el=>countUp(el, parseFloat(el.dataset.count)));

/* ---- the pile: each card sticks, then the next settles onto it ---- */
let pileItems=[], PILE_TOP=112;
const PEEK = 11;
function layoutPile(){
  pileItems=[...document.querySelectorAll('#pile .pile-item')];
  if(!pileItems.length) return;
  const sw=document.querySelector('.segwrap');
  if(sw){
    const stick=parseFloat(getComputedStyle(sw).top)||62;
    PILE_TOP=Math.round(stick+sw.offsetHeight);
  }
  pileItems.forEach((el,i)=>{ el.style.top=(PILE_TOP+i*PEEK)+'px'; });
  stepPile();
}
function stepPile(){
  if(!pileItems.length) return;
  const scTop=$('#scroll').getBoundingClientRect().top;
  const a=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--pile-sh-a'))||.5;
  for(let i=0;i<pileItems.length;i++){
    const cardEl=pileItems[i].firstElementChild, next=pileItems[i+1];
    let p=0;
    if(next){
      const stick=scTop+PILE_TOP+i*PEEK;
      const h=pileItems[i].offsetHeight;
      const gap=next.getBoundingClientRect().top-stick;
      p=1-Math.max(0,Math.min(1,gap/(h||1)));
    }
    const e=p*p*(3-2*p);                       /* smoothstep */
    cardEl.style.transform=`scale(${(1-.085*e).toFixed(4)}) translateY(${(-9*e).toFixed(2)}px)`;
    cardEl.style.borderRadius=(26+8*e).toFixed(1)+'px';
    cardEl.style.setProperty('--shade',e.toFixed(3));
    cardEl.style.boxShadow=`0 ${(18-10*e).toFixed(0)}px ${(50-24*e).toFixed(0)}px rgba(6,19,5,${(a-.4*a*e).toFixed(3)})`;
  }
}
addEventListener('resize',()=>{ layoutPile(); },{passive:true});

function tapeHTML(feed,slow){
  const one = feed.filter(o=>o.d!==null&&o.d!==undefined).map(o=>
    `<button class="tick" data-sym="${o.t}"><b>${o.t}</b><i>${money(o.p)}</i>` +
    `<em class="${o.d<0?'down':o.d>0?'up':''}">${o.d>0?'▲':o.d<0?'▼':'■'}${Math.abs(o.d).toFixed(1)}%</em></button>`
  ).join('');
  return `<div class="tape ${slow?'slow':''}" aria-label="Live prices">
    <div class="tape-run">${one}${one}</div></div>`;
}
const JUMPS=[['movers','Movers'],['sectors','Sectors'],['stocks','Stocks'],['etfs','ETFs'],
             ['crypto','Crypto'],['ipos','IPOs'],['collections','Collections'],['watch','Watchlist']];

function symRow(x){
  return `<button class="row" data-sym="${x.t}">
    <div class="ricon" style="font-size:11px">${x.t.slice(0,2)}</div>
    <div class="rmain"><b>${x.n}</b><span>${x.coll?'Collection':x.t}${x.note?' · '+x.note:''}</span></div>
    <div class="ramt">${x.p?`<b>${money(x.p)}</b>`:''}
      <span class="${x.d<0?'down':'up'}">${x.p||x.coll?pct(x.d):'IPO'}</span></div></button>`;
}
function sect(id,title,count,lede,inner){
  return `<section class="sect" id="sec-${id}">

    ${lede?`<p class="lede rv">${lede}</p>`:''}

}
function renderDiscover(){
  const D=DB.discover;

  const priced=allSyms().filter(x=>x.p&&x.d);

  <h2 class="title rv">Markets</h2>

  </div>
  <div id="discResults" hidden></div>
  <div id="discSections">
    ${sect('movers','Today\'s movers',`${gain.length+lose.length} names`,
      'The widest swings across everything tradable here.',
      `<div class="eyebrow" style="margin-bottom:6px">Up most</div>${gain.map(mover).join('')}
       <div class="hr"></div>
       <div class="eyebrow" style="margin-bottom:6px">Down most</div>${lose.map(mover).join('')}`)}
    ${sect('sectors','Sectors',`${DB.sectors.length}`,
      'Where the TSX is leaning today, measured from flat.',
      DB.sectors.map(z=>{const w=(Math.abs(z.d)/mx*46).toFixed(1);
        return `<div class="sectorbar">
          <span class="n">${z.n}</span>
          <span class="rail"><i class="${z.d<0?'neg':'pos'}" data-w="${w}%"
            style="${z.d<0?`left:${(50-w).toFixed(1)}%`:'left:50%'}"></i></span>
          <span class="v ${z.d<0?'down':'up'}">${pct(z.d)}</span></div>`;}).join(''))}
    ${sect('stocks','Stocks',`${D.Stocks.length}`,'',`<div class="rows">${D.Stocks.map(symRow).join('')}</div>`)}
    ${sect('etfs','ETFs',`${D.ETFs.length}`,'',`<div class="rows">${D.ETFs.map(symRow).join('')}</div>`)}
    ${sect('crypto','Crypto',`${D.Crypto.length}`,'Trades around the clock, including weekends.',
      `<div class="rows">${D.Crypto.map(symRow).join('')}</div>`)}
    ${sect('ipos','Upcoming IPOs',`${D.IPOs.length}`,'Register interest before pricing day.',
      `<div class="rows">${D.IPOs.map(symRow).join('')}</div>`)}
    ${sect('collections','Collections',`${D.Collections.length}`,'Themed baskets, bought as one order.',
      `<div class="rows">${D.Collections.map(symRow).join('')}</div>`)}
    ${sect('watch','Watchlist',`${DB.watch.length}`,'',
      watched.length?`<div class="rows">${watched.map(symRow).join('')}</div>`
        :`<div class="empty"><b>Nothing starred yet</b>Open anything above and tap the star.</div>`)}

  const box=$('#discSearch');

    secs.hidden=true; res.hidden=false;
    res.innerHTML=`<div class="panel card">${discRows(q)}</div>`;
  });

function allSyms(){ return Object.values(DB.discover).flat(); }
function discRows(q){

function paintChat(typing){
  const c=$('#chat'); if(!c) return;
  c.innerHTML = STATE.chat.map(m=>`<div class="msg ${m.who}">${m.text}</div>`).join('')

function sendAsk(text){

/* --- the intent engine: ~22 rules over live DB values --- */
function answer(raw){
  const q=raw.toLowerCase();
  const has=(...w)=>w.some(t=>q.includes(t));
  const kv=s=>`<span class="kv">${s}</span>`;

  if(has('freeze','lock my card','stop my card')){
    card().frozen=true; if(STATE.tab==='home'&&STATE.seg==='card') renderHome();
    return `${card().label} card frozen. Nothing new will go through — taps, online, ATM. Unfreeze any time from <b>Home → Card</b>.`;
  }
  if(has('unfreeze','unlock my card')){
    card().frozen=false; if(STATE.tab==='home'&&STATE.seg==='card') renderHome();
    return `${card().label} card is live again.`;
  }
  if(has('total','net worth','all my money','how much do i have','how much money'))
    return `Across every account you have ${kv(money(netWorth()))}. That's Spend ${kv(money(DB.accounts[0].bal))}, Grow ${kv(money(DB.accounts[1].bal))} and Invest ${kv(money(DB.accounts[2].bal))}.`;
  if(has('chequing','checking','spend account','in spend'))
    return `Spend has ${kv(money(DB.accounts[0].bal))} available, plus ${kv(money0(DB.cardSettings.cushion))} of Cushion behind it.`;
  if(has('savings','grow','interest','apy'))
    return `Grow holds ${kv(money(DB.accounts[1].bal))} at 4.10%. It earned ${kv('$31.42')} in July.`;
  if(has('portfolio','invested','investments','how are my stocks','tfsa')){
    const d=dayChange();
    return `Your portfolio is ${kv(money(portfolio()))}, ${d<0?'down':'up'} ${kv(signed(d))} today. ${DB.holdings.length} positions plus ${kv(money(DB.cash))} in cash.`;
  }
  const sym = DB.holdings.find(h=>q.includes(h.t.split('.')[0].toLowerCase())||q.includes(h.n.toLowerCase().split(' ')[0]));
  if(sym) return `${sym.n} (${sym.t}) is ${kv(money(sym.p))}, ${sym.d<0?'down':'up'} ${kv(pct(sym.d))} today. You hold ${kv(sym.q+'')} worth ${kv(money(sym.q*sym.p))}.`;
  if(has('spent','spending','how much have i')){
    return `${DB.spend.month} spending is ${kv(money(DB.spend.total))} of a ${kv(money0(DB.spend.budget))} budget — ${kv(money(spendLeft()))} left with 7 days to go.`;
  }
  const cat = DB.spend.cats.find(c=>q.includes(c.n.toLowerCase().split(' ')[0]));
  if(cat) return `${cat.n} is ${kv(money(cat.v))} this month — ${kv((cat.v/DB.spend.total*100).toFixed(0)+'%')} of everything you've spent.`;
  if(has('afford','can i spend','safe to spend','left to spend'))
    return `You've got ${kv(money(spendLeft()))} of budget left, which is about ${kv(money(spendLeft()/7))} a day until the month closes. Rent of ${kv(money(1150))} is already accounted for.`;
  if(has('biggest','most','top expense','largest'))
    return `Rent at ${kv(money(1150))} is the largest single charge. Ignoring rent, <b>Groceries</b> leads at ${kv(money(DB.spend.cats[0].v))}.`;
  if(has('rent'))
    return `Rent is ${kv(money(1150))} to Crystal Ridge, due <b>Aug 1</b> — 7 days out. Spend covers it with ${kv(money(DB.accounts[0].bal-1150))} to spare.`;
  if(has('bill','due','upcoming','coming up')){
    const t=DB.bills.reduce((s,b)=>s+b.a,0);
    return `Three bills in the next ten days totalling ${kv(money(t))}: ` + DB.bills.map(b=>`${b.n} ${money(b.a)} on ${b.due}`).join(', ') + '.';
  }
  if(has('credit score','my score','equifax'))
    return `You're at ${kv(DB.credit.score+'')} — ${DB.credit.band}, up ${kv(DB.credit.delta+' points')} this month. Six months ago it was ${kv(DB.credit.hist[0]+'')}.`;
  if(has('improve','raise my','build credit','credit up','why did my credit'))
    return `Two things are moving it. Payment history is perfect at 100%, and that's the heavy one. The drag is <b>credit used</b> at 36% — paying the Credit Builder down to ${kv('$150')} puts you under 30%, which usually reads better.`;
  if(has('card number','card details','cvv','expiry','reveal'))
    return `Open <b>Home → Card</b> and tap <b>Show details</b>. The number, expiry and CVV appear on the card itself. It's a virtual card, so those details work online right away.`;
  if(has('cushion','overdraft','negative','short'))
    return `Cushion fronts you up to ${kv(money0(DB.cardSettings.cushion))} when a purchase would overdraw Spend. No fee, no interest — it comes off your next deposit automatically.`;
  if(has('paid','payday','payroll','salary'))
    return `Your last payroll was ${kv(money(1842.55))} from Skechers on <b>Jul 23</b>. Early payday releases direct deposits up to ${kv(DB.cardSettings.payday+' days')} before the official date, so the next one should land around <b>Aug 5</b>.`;
  if(has('round','spare change'))
    return `Every card purchase rounds up to the next dollar and the difference moves to Grow. It's added ${kv('$12.80')} this week. Toggle it under <b>Invest → Automation</b>.`;
  if(has('goal','saving for','emergency fund','laptop','tires')){
    const g=DB.goals.map(x=>`${x.n} ${money(x.now)}/${money0(x.tgt)}`).join(', ');
    return `Three goals running: ${kv(g)}. Round-ups feed them automatically.`;
  }
  if(has('automation','auto-invest','automatic','recurring')){
    const on=DB.automation.filter(a=>a.on).map(a=>a.b).join(', ');
    return `Active right now: ${kv(on)}. The full list is under <b>Invest → Automation</b>.`;
  }
  if(has('watchlist','watching','starred'))
    return DB.watch.length ? `You're watching ${kv(DB.watch.join(', '))}. Tap any of them in <b>Discover</b> for the chart.`
                           : `Your watchlist is empty. Star anything in <b>Discover</b> to track it.`;
  if(has('send','transfer','e-transfer','pay someone','move money'))
    return `Use the <b>Move</b> tab. Pick a person, type the amount, send. Between your own Aurora accounts it's instant; to anyone else it goes out as an Interac e-Transfer.`;
  if(has('protected','safe','insured','cdic','security'))
    return `Deposits are held at a CDIC member institution and covered to ${kv('$100,000')}. The card is virtual, so you can freeze or replace the number without waiting on plastic. This is a demo build, though — no real money is involved.`;
  if(has('hello','hi ','hey','good morning','good evening'))
    return `Hey ${DB.user.first}. Your balance is ${kv(money(netWorth()))} and nothing needs your attention today.`;
  if(has('what can you','help','who are you','what do you do'))
    return `I read your accounts on this device and answer from them. Try: <b>how much can I spend</b>, <b>when is rent due</b>, <b>how is my portfolio doing</b>, <b>why did my credit score change</b>, or <b>freeze my card</b>.`;
  return `I don't have a rule for that one yet — this assistant runs entirely on-device with no model behind it, so it only knows your accounts. Try asking about your <b>balance</b>, <b>spending</b>, <b>bills</b>, <b>credit score</b>, <b>portfolio</b> or your <b>card</b>.`;
}

document.addEventListener('click',e=>{
  const t=e.target;
  const q=s=>t.closest(s);

  const jump=q('[data-seg-jump]');
  if(jump){ STATE.seg=jump.dataset.segJump;
    $$('#seg button').forEach(x=>x.setAttribute('aria-selected',x.dataset.seg===STATE.seg));
    $('#seg').querySelector(`[data-seg="${STATE.seg}"]`).scrollIntoView({inline:'center',behavior:'smooth'});
    renderHome(); $('#scroll').scrollTop=0; return; }

  const ci=q('[data-card-idx]');
  if(ci){ const idx=+ci.dataset.cardIdx;
          if(idx===STATE.cardIdx) return;
          STATE.cardIdx=idx; STATE.reveal=false; restack();
          toast(`${card().label} card`); return; }

  const cb=q('[data-card]');
  if(cb){ if(cb.dataset.card==='reveal'){ STATE.reveal=!STATE.reveal; toast(STATE.reveal?'Details visible':'Details hidden'); }
          else { card().frozen=!card().frozen; toast(card().frozen?`${card().label} card frozen`:`${card().label} card unfrozen`); }
          restack(); return; }

  const tg=q('[data-tog]');
  if(tg){ const k=tg.dataset.tog; DB.cardSettings[k]=!DB.cardSettings[k];
          tg.setAttribute('aria-pressed',DB.cardSettings[k]);
          toast(`${tg.querySelector('b').textContent} ${DB.cardSettings[k]?'on':'off'}`); return; }

  const au=q('[data-auto]');
  if(au){ const a=DB.automation.find(x=>x.id===au.dataset.auto); a.on=!a.on;
          au.setAttribute('aria-pressed',a.on); toast(`${a.b} ${a.on?'on':'off'}`); return; }

  const ch=q('[data-cat]');
  if(ch){ $$('#txChips .chip').forEach(c=>c.setAttribute('aria-pressed',c===ch));
          $('#txList').innerHTML=txRows(ch.dataset.cat); return; }

  const tx=q('[data-tx]');
  if(tx){ const x=DB.tx[+tx.dataset.tx];
    openSheet(`<div class="eyebrow">${x.d}</div>
      <h3 style="font-family:var(--f-display);font-size:22px;margin:4px 0 2px;letter-spacing:-.03em">${x.m}</h3>
      <div style="font-family:var(--f-display);font-size:32px;font-weight:700;letter-spacing:-.035em;margin:8px 0 14px"
        class="${x.a>0?'up':''}">${x.a>0?'+':''}${money(x.a).replace('-','−')}</div>
      <div class="stats">
        <div class="stat"><span class="k">Category</span><span class="v" style="font-size:14px">${x.c}</span></div>
        <div class="stat"><span class="k">Account</span><span class="v" style="font-size:14px">Spend ·· 4182</span></div>
        <div class="stat"><span class="k">Status</span><span class="v" style="font-size:14px">Settled</span></div>
        <div class="stat"><span class="k">Method</span><span class="v" style="font-size:14px">${x.c==='Transfer'?'Internal':'Tap'}</span></div>
      </div>
      <div class="btn2" style="margin-top:16px">
        <button class="btn ghost" data-act="split">Split with someone</button>
        <button class="btn alert" data-act="dispute">Report a problem</button>
      </div>
      <button class="btn ghost" style="margin-top:10px" onclick="closeSheet()">Close</button>`); return; }

  const g=q('[data-goal]');
  if(g){ const goal=DB.goals[+g.dataset.goal], add=+g.dataset.add;
         goal.now=Math.min(goal.tgt,goal.now+add); DB.accounts[1].bal-=add;
         toast(`${money(add)} added to ${goal.n}`); renderHome(); return; }

  const rg=q('[data-range]');
  if(rg){ STATE.range=rg.dataset.range; renderInvest(); animateBars(); revealOn(); return; }

  const sy=q('[data-sym]'); if(sy){ symSheet(sy.dataset.sym); return; }

  const st=q('[data-star]');
  if(st){ const s=st.dataset.star; const i=DB.watch.indexOf(s);
          if(i<0){ DB.watch.push(s); toast(`${s} added to watchlist`); }
          else { DB.watch.splice(i,1); toast(`${s} removed`); }
          closeSheet(); if(STATE.tab==='discover') renderDiscover(); return; }

  const by=q('[data-buy]');
  if(by){ closeSheet(); toast(`Demo order for ${by.dataset.buy} — nothing was bought`); return; }

  const jp=q('[data-jump]');
  if(jp){ const el=$('#sec-'+jp.dataset.jump);
          if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); return; }

  const br=q('[data-branch]');
  if(br){ toast(`${br.dataset.branch} — demo only`); return; }

  const pp=q('[data-person]');
  if(pp){ STATE.payee = STATE.payee===pp.dataset.person ? null : pp.dataset.person;
          $$('#people .person').forEach(x=>x.setAttribute('aria-pressed',x.dataset.person===STATE.payee)); return; }

  const pd=q('[data-pad]');
  if(pd){ const k=pd.dataset.pad; let a=STATE.amount;
    if(k==='⌫') a=a.slice(0,-1);
    else if(k==='.'){ if(!a.includes('.')) a=(a||'0')+'.'; }
    else if(!(a.includes('.') && a.split('.')[1].length>=2)) a=(a==='0'?'':a)+k;
    STATE.amount=a; $('.padamt').textContent='$'+(a||'0'); return; }

  const say=q('[data-say]'); if(say){ sendAsk(say.dataset.say); return; }

  const ac=q('[data-act]');
  if(ac){
    const a=ac.dataset.act;
    if(a==='send-now'||a==='request'){
      const v=parseFloat(STATE.amount||'0');
      if(!STATE.payee) return toast('Pick someone to send to');
      if(!v) return toast('Enter an amount');
      if(a==='send-now'&&v>DB.accounts[0].bal) return toast('More than Spend can cover');
      if(a==='send-now'){ DB.accounts[0].bal-=v; DB.moves.unshift({n:STATE.payee,s:'Interac e-Transfer · sent',a:-v}); }
      else DB.moves.unshift({n:STATE.payee,s:'Request sent',a:0});
      toast(a==='send-now'?`${money(v)} sent to ${STATE.payee}`:`Requested ${money(v)} from ${STATE.payee}`);
      STATE.amount=''; STATE.payee=null; renderMove(); revealOn(); return;
    }
    if(a==='send'||a==='to-grow'||a==='to-invest'||a==='pay-build'){ go('move'); return; }
    toast('Demo build — that flow is a placeholder');
  }
});

/* Enter/Space on a stacked card behaves like a tap */
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter'&&e.key!==' ') return;
  const el=e.target.closest&&e.target.closest('.slot[role="button"]');
  if(el){ e.preventDefault(); el.click(); }
});

/* card tilt + sheen */
$('#phone').addEventListener('pointermove',e=>{
  const c=$('#cardArt'); if(!c) return;
  const r=c.getBoundingClientRect();
  const x=(e.clientX-r.left)/r.width, y=(e.clientY-r.top)/r.height;
  if(x<-.2||x>1.2||y<-.4||y>1.4){ c.style.setProperty('--rx','0deg'); c.style.setProperty('--ry','0deg'); return; }
  c.style.setProperty('--ry',((x-.5)*6).toFixed(2)+'deg');
  c.style.setProperty('--rx',((.5-y)*4).toFixed(2)+'deg');
  c.style.setProperty('--sheen',(x*30-14).toFixed(1)+'%');
},{passive:true});

/* ============================================================
   10. THEME — the ramp is fixed, only role bindings flip
   ============================================================ */
function setTheme(t){
  document.documentElement.dataset.theme = t;
  $('#metaTheme').setAttribute('content', t==='light' ? '#eff8ed' : '#061305');
  const b=$('#btnTheme');
  b.innerHTML = ic(t==='light' ? 'i-moon' : 'i-sun');
  b.setAttribute('aria-label', t==='light' ? 'Switch to dark mode' : 'Switch to light mode');
}
$('#btnTheme').addEventListener('click',()=>{
  const next = document.documentElement.dataset.theme==='light' ? 'dark' : 'light';
  setTheme(next); toast(next==='light' ? 'Light mode' : 'Dark mode');
});
const mqLight = matchMedia('(prefers-color-scheme: light)');
if(mqLight.addEventListener) mqLight.addEventListener('change',e=>setTheme(e.matches?'light':'dark'));

/* ============================================================
   11. INIT
   ============================================================ */
(function init(){
  const h=new Date().getHours();
  $('#greetTime').textContent = (h<12?'Good morning':h<17?'Good afternoon':'Good evening') + ' · ' + DB.user.city;
  setTheme(document.documentElement.dataset.theme||'dark');
  renderHome();
  requestAnimationFrame(()=>{
    animateBars(); revealOn();
    const gf=$('#gaugeFill'); if(gf) gf.style.strokeDashoffset=251.3*(1-(DB.credit.score-300)/600);
  });
})();
</script>
